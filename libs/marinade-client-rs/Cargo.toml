[package]
name = "marinade-client-rs"
version = "1.0.0"
edition = "2021"
publish = false

[dependencies]
solana-sdk = "2.3"
once_cell = "1.8.0"
thiserror = "1.0.30"
anyhow = "1.0.71"
bincode = "1.3.3"
spl-token = { version = "7.0", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "6.0", features = ["no-entrypoint"] }
log = "0.4.18"
solana-client = "2.3"
solana-sdk-ids = "2.2"
solana-stake-interface = { version = "1.2", features = ["serde"] }
base64 = "0.22"
marinade-finance = { path = "/home/chalda/marinade/liquid-staking-program/programs/marinade-finance" }
dynsigner = { path = "../dynsigner" }
anchor-lang = "=0.32.1"
anchor-client = { version = "=0.32.1", features = ["async"] }
